version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: polyglotdoc-api
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./storage:/workspace/backend_fastapi/storage
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: polyglotdoc-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  redis-data:
