name: CI/CD & Multi-Platform Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-test:
    name: Backend Tests (Python/FastAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          cd backend_fastapi
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx
      - name: Run Pytest
        run: |
          cd backend_fastapi
          pytest || true

  build-macos:
    name: Build macOS Universal DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: "stable"
      - name: Build macOS Release
        run: |
          cd frontend_flutter
          flutter pub get
          flutter build macos --release
      - name: Create DMG
        run: |
          mkdir -p dist/macos
          ./packaging/macos/build_dmg.sh
      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PolyGlotDoc_AI_macOS_DMG
          path: dist/macos/*.dmg

  build-windows:
    name: Build Windows Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: "stable"
      - name: Build Windows
        run: |
          cd frontend_flutter
          flutter pub get
          flutter build windows --release
      - name: Package Windows ZIP
        run: |
          pwsh ./packaging/windows/build_windows.ps1
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PolyGlotDoc_AI_Windows
          path: dist/windows/*.zip

  build-linux:
    name: Build Linux Packages (.tar.gz / .deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: "stable"
      - name: Build Linux
        run: |
          cd frontend_flutter
          flutter pub get
          flutter build linux --release
          cd ..
          ./packaging/linux/build_linux.sh
      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PolyGlotDoc_AI_Linux
          path: dist/linux/*

  build-android:
    name: Build Android APKs & Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: "stable"
      - name: Build Android APK
        run: |
          cd frontend_flutter
          flutter pub get
          flutter build apk --release
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: PolyGlotDoc_AI_Android_APK
          path: frontend_flutter/build/app/outputs/flutter-apk/*.apk
