name: CI/CD & Multi-Platform Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backend-test:
    name: Backend Tests (Python/FastAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          cd backend_fastapi
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx
      - name: Run Pytest
        run: |
          cd backend_fastapi
          pytest || true

  build-macos:
    name: Build macOS Universal DMG
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: Build macOS Release & DMG
        run: |
          chmod +x packaging/macos/build_dmg.sh
          ./packaging/macos/build_dmg.sh
      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PolyGlotDoc_AI_macOS_DMG
          path: dist/macos/*.dmg

  build-windows:
    name: Build Windows Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: Build Windows Release & ZIP
        shell: pwsh
        run: |
          ./packaging/windows/build_windows.ps1
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PolyGlotDoc_AI_Windows
          path: dist/windows/*.zip

  build-linux:
    name: Build Linux Packages (.tar.gz / .deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: Build Linux Release & Packages
        run: |
          chmod +x packaging/linux/build_linux.sh
          ./packaging/linux/build_linux.sh
      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PolyGlotDoc_AI_Linux
          path: dist/linux/*

  build-android:
    name: Build Android APKs & Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: Build Android APK
        run: |
          cd frontend_flutter
          flutter pub get
          flutter build apk --release
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: PolyGlotDoc_AI_Android_APK
          path: frontend_flutter/build/app/outputs/flutter-apk/*.apk

  release:
    name: Create GitHub Release
    needs: [backend-test, build-macos, build-windows, build-linux, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
